global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  #Prometheus conatainer metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
  #host system metrics
  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]
  #Grafana conatainer metrics
  - job_name: 'grafana'
    static_configs:
      - targets: [ 'grafana:3000' ]
